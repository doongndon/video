<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#16181c" />
  <link rel="icon" href="site/img/favicon.svg" type="image/svg+xml" />
  <title>Montage 영상 편집기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/photo.css" />
  <link rel="stylesheet" href="styles/photo-dialogs.css" />
  <link rel="stylesheet" href="styles/docs.css" />
  <script>
    // Right after a new version is published, the browser can mix new script files with old ones it
    // still keeps ("does not provide an export named …"). Fetch every script and style this page
    // loaded again from the server, then reload (at most once a minute, so it can never loop).
    window.montageRefreshCache = async function () {
      try {
        if (Date.now() - (+sessionStorage.getItem('montage.cacheRefresh') || 0) < 60000) return false;
        sessionStorage.setItem('montage.cacheRefresh', String(Date.now()));
      } catch (e) { return false; }
      var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; })
        .filter(function (u) { return u.indexOf(location.origin) === 0 && /\.(m?js|css)(\?|#|$)/.test(u); });
      urls.push(location.href);
      await Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }));
      location.reload();
      return true;
    };
    window.montageStaleModule = function (msg) {
      return /does not provide an export named|Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module/i.test(String(msg || ''));
    };
    window.addEventListener('error', function (e) {
      if (window.montageStaleModule(e.message)) window.montageRefreshCache();
    });
  </script>
</head>
<body>
  <div id="app">
    <header id="menubar"></header>
    <main id="workspace">
      <div class="row" id="row-top">
        <section class="panel-group" id="pg-top-left"></section>
        <div class="splitter v" data-var="--tl-w" data-target="pg-top-left"></div>
        <section class="panel-group" id="pg-top-right"></section>
      </div>
      <div class="splitter h" data-var="--top-h" data-target="row-top"></div>
      <div class="row" id="row-bottom">
        <section class="panel-group" id="pg-bottom-left"></section>
        <div class="splitter v" data-var="--bl-w" data-target="pg-bottom-left"></div>
        <section id="tools" aria-label="도구"></section>
        <section class="panel-group" id="pg-timeline"></section>
        <section id="meters" aria-label="오디오 레벨"></section>
      </div>
    </main>
    <div id="photo" hidden></div>
    <footer id="statusbar"></footer>
  </div>
  <div id="drop-overlay" hidden>여기에 놓으면 파일을 가져옵니다</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
